<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>커넥트웨이브 HR 레이더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#eef2f1; --surf:#ffffff; --surf2:#f6f8f8; --line:#dbe2e1; --line2:#c6d0cf;
  --ink:#13212b; --muted:#56646e; --sub:#86939b;
  --accent:#12324a; --accent-ink:#ffffff; --accent-soft:#e3ebf1;
  --high:#c2410c; --high-bg:#fdebe2; --mid:#a86a00; --mid-bg:#fbf0d9; --low:#6b7780; --low-bg:#edf0f1;
  --c-market:#2560b8; --c-trend:#7646c2; --c-labor:#56761a; --c-ecom:#0d7a70; --c-brand:#b8325e;
  --own:#0d7a70; --own-bg:#dff3ef;
  --shadow:0 1px 2px rgba(19,33,43,.06),0 4px 14px rgba(19,33,43,.04);
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e151a; --surf:#151f26; --surf2:#1a262e; --line:#25333c; --line2:#34444e;
    --ink:#e4eaed; --muted:#9aa8b1; --sub:#6f7e88;
    --accent:#9cc2df; --accent-ink:#0e151a; --accent-soft:#1d3142;
    --high:#ff8a57; --high-bg:#3a2016; --mid:#e2ad4a; --mid-bg:#342a14; --low:#98a4ac; --low-bg:#222d34;
    --c-market:#7aa8ef; --c-trend:#b393ee; --c-labor:#a5c56a; --c-ecom:#5cc8b9; --c-brand:#ee84a6;
    --own:#5cc8b9; --own-bg:#15332f;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e151a; --surf:#151f26; --surf2:#1a262e; --line:#25333c; --line2:#34444e;
  --ink:#e4eaed; --muted:#9aa8b1; --sub:#6f7e88;
  --accent:#9cc2df; --accent-ink:#0e151a; --accent-soft:#1d3142;
  --high:#ff8a57; --high-bg:#3a2016; --mid:#e2ad4a; --mid-bg:#342a14; --low:#98a4ac; --low-bg:#222d34;
  --c-market:#7aa8ef; --c-trend:#b393ee; --c-labor:#a5c56a; --c-ecom:#5cc8b9; --c-brand:#ee84a6;
  --own:#5cc8b9; --own-bg:#15332f;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surf) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark svg{width:22px;height:22px}
.brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.brand p{margin:0;font-size:11.5px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surf2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.iconbtn{width:30px;height:30px;border:1px solid var(--line);background:var(--surf);border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover:not(:disabled){color:var(--ink);border-color:var(--line2)}
.iconbtn:disabled{opacity:.35;cursor:default}
.range{min-width:150px;text-align:center;font-size:12.5px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:var(--line2)}
.tools{display:flex;gap:6px;align-items:center}

.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
.notice{border:1px dashed var(--mid);background:var(--mid-bg);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:12.5px}
.notice b{color:var(--mid)}

/* brief */
.brief{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.lead{padding:20px 22px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--sub);text-transform:uppercase;display:flex;gap:8px;align-items:center}
.eyebrow .mono{letter-spacing:0;text-transform:none}
.lead h2{margin:6px 0 12px;font-size:21px;line-height:1.4;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.points{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.points li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px 8px;align-items:start}
.pt-n{font-family:var(--mono);font-size:12px;color:var(--high);font-weight:500;padding-top:3px}
.pt-title{font-size:15px;font-weight:700;line-height:1.45;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
a.pt-title:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.pt-title svg{display:inline-block;margin-left:5px;vertical-align:1px;color:var(--sub)}
.pt-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:11.5px;color:var(--sub);margin-top:1px}
.pt-meta .dot{width:6px;height:6px}
.pt-more button{border:0;background:none;padding:0;font-size:12.5px;font-weight:600;color:var(--high);cursor:pointer}
.stats{padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.hero-kpi{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 12px;padding:14px 16px;border-radius:12px;background:var(--high-bg);color:var(--high)}
.hero-kpi:hover{filter:brightness(.98)}
.hero-kpi:focus-visible{outline:2px solid var(--high);outline-offset:2px}
.hero-kpi[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--high)}
.hk-label{grid-column:1/-1;font-size:13px;font-weight:700;letter-spacing:.02em}
.hk-num{display:flex;align-items:baseline;gap:4px;line-height:1}
.hk-num b{font-family:var(--mono);font-size:64px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hk-num i{font-style:normal;font-size:18px;font-weight:700}
.hk-go{font-size:12px;font-weight:600;padding-bottom:8px;white-space:nowrap}
.hero-kpi.zero{background:var(--surf2);color:var(--muted);cursor:default}
.minor{display:flex;flex-direction:column;gap:6px}
.kpi-line{margin:0;font-size:11px;color:var(--sub)}
.kpi-line b{font-weight:500;color:var(--muted)}
.dist-bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--surf2);gap:2px}
.dist-bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .dot{width:6px;height:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* body grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.grid>*,.brief>*{min-width:0}
.filters{display:flex;flex-direction:column;gap:10px;min-width:0}
#teamChips{min-width:0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px 9px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--sub);font-weight:400}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row label.lbl{font-size:11.5px;color:var(--sub);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sep{width:1px;height:16px;background:var(--line2);margin:0 2px}
.reset{margin-left:auto;border:0;background:none;padding:3px 4px;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.reset:hover{text-decoration:underline}
.search{flex:1;min-width:160px;max-width:280px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:5px 10px 5px 30px;font-size:12.5px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--sub)}

.list{display:flex;flex-direction:column;gap:10px}
.day-h{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:6px}
.day-h::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card.is-high{border-color:color-mix(in srgb,var(--high) 40%,var(--line))}
.card summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card summary::-webkit-details-marker{display:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--muted)}
.cat{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.pill{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px}
.pill.high{background:var(--high-bg);color:var(--high)}
.pill.mid{background:var(--mid-bg);color:var(--mid)}
.pill.own{background:var(--own-bg);color:var(--own)}
.meta .co{color:var(--ink);font-weight:600}
.meta .dt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--sub)}
.card h3{margin:0;font-size:15.5px;line-height:1.45;font-weight:700;letter-spacing:-.01em}
.card .body{margin:0;color:var(--muted);font-size:13.5px}
.more{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.more svg{transition:transform .15s}
.card[open] .more svg{transform:rotate(180deg)}
.card[open] .more .t1,.card:not([open]) .more .t2{display:none}
.detail{padding:0 16px 16px;display:grid;gap:12px}
.box{background:var(--surf2);border-radius:9px;padding:10px 12px}
.box h4{margin:0 0 3px;font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.03em}
.box p{margin:0;font-size:13.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.team{border:1px solid var(--line2);border-radius:999px;padding:1px 9px;font-size:11.5px;color:var(--ink)}
.tag{font-size:11.5px;color:var(--sub)}
.srcs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.srcs a{font-size:12.5px;text-decoration:none;display:flex;gap:8px;align-items:baseline}
.srcs a:hover .st{text-decoration:underline}
.srcs .sn{font-weight:600;flex:none;color:var(--ink)}
.srcs .st{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surf);border:1px dashed var(--line2);border-radius:12px}

/* rail */
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.rail .panel{padding:14px 16px}
.rail h5{margin:0 0 10px;font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .dw{font-size:10px;color:var(--sub);font-weight:600;padding-bottom:2px}
.cal-grid button{border:0;background:none;aspect-ratio:1;border-radius:7px;font-family:var(--mono);font-size:11.5px;color:var(--sub);cursor:default;position:relative;padding:0}
.cal-grid button.has{color:var(--ink);cursor:pointer;font-weight:500}
.cal-grid button.has::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.cal-grid button.has.hot::after{background:var(--high)}
.cal-grid button.inr{background:var(--accent-soft)}
.cal-grid button.sel{background:var(--accent);color:var(--accent-ink)}
.cal-grid button.sel::after{background:var(--accent-ink)}
.cal-grid button.has:hover:not(.sel){background:var(--surf2)}
.rank{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12.5px}
.rank button{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank button:hover{color:var(--accent);text-decoration:underline}
.rank .bar{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--sub)}
.rank .bar i{display:block;height:5px;border-radius:3px;background:var(--line2)}
.spark{width:100%;height:64px;display:block}
.foot{font-size:11.5px;color:var(--sub);line-height:1.7}

@media (max-width:980px){
  .grid{grid-template-columns:1fr}
  .rail{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
}
@media (max-width:760px){
  .brief{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .lead h2{font-size:18px}
  .search{max-width:none;margin-left:0;flex-basis:100%}
  .range{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5" opacity=".6"/><path d="M12 12 18.4 5.6"/><circle cx="16" cy="9.5" r="1.3" fill="currentColor" stroke="none"/></svg>
      </div>
      <div><h1 id="siteTitle">커넥트웨이브 HR 레이더</h1><p id="siteSub">HR실 데일리 인텔리전스 브리핑</p></div>
    </div>
    <div class="seg" role="group" aria-label="보기 단위">
      <button type="button" id="v-day" data-view="day" aria-pressed="true">일간</button>
      <button type="button" id="v-week" data-view="week" aria-pressed="false">주간</button>
      <button type="button" id="v-month" data-view="month" aria-pressed="false">월간</button>
    </div>
    <div class="stepper">
      <button class="iconbtn" id="prev" type="button" aria-label="이전"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3 5 8l5 5"/></svg></button>
      <span class="range mono" id="rangeLabel">—</span>
      <button class="iconbtn" id="next" type="button" aria-label="다음"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 3 5 5-5 5"/></svg></button>
    </div>
    <div class="tools">
      <button class="btn" id="csv" type="button" title="지금 보이는 카드를 CSV로 받기">CSV</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="notice" id="sampleNote" hidden><b>샘플 데이터예요.</b> 회사명·기사는 화면 확인용 예시이고, 첫 자동 수집이 끝나면 실제 뉴스로 바뀌어요.</div>

  <section class="brief">
    <div class="panel lead">
      <div class="eyebrow"><span id="leadEyebrow">오늘의 브리핑</span><span class="mono" id="leadDate"></span></div>
      <h2 id="headline">불러오는 중…</h2>
      <ol class="points" id="points"></ol>
    </div>
    <div class="panel stats">
      <button class="hero-kpi" type="button" id="heroHigh" aria-pressed="false" title="꼭 볼 이슈만 목록에 보여줘요">
        <span class="hk-label">꼭 볼 이슈</span>
        <span class="hk-num"><b id="kHigh">0</b><i>건</i></span>
        <span class="hk-go" id="heroHint">꼭 볼 이슈만 보기 →</span>
      </button>
      <div class="minor">
        <p class="kpi-line mono">정리된 이슈 <b id="kCards">0</b> · 검토한 기사 <b id="kArticles">0</b></p>
        <div class="dist-bar" id="distBar" aria-hidden="true"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
  </section>

  <div class="grid">
    <section class="filters" aria-label="이슈 목록">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="row">
        <label class="lbl">필터</label>
        <span class="row" id="teamChips"></span>
        <span class="sep" aria-hidden="true"></span>
        <button class="chip" type="button" id="onlyHigh" aria-pressed="false">꼭 볼 이슈만</button>
        <button class="chip" type="button" id="onlyOwn" aria-pressed="false">우리 그룹 언급</button>
        <button class="reset" type="button" id="resetFilters" hidden>선택 초기화</button>
      </div>
      <div class="row">
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <input type="search" id="q" placeholder="기업, 키워드 검색" aria-label="검색">
        </div>
      </div>
      <div class="list" id="list"></div>
    </section>

    <aside class="rail">
      <div class="panel">
        <h5><span id="calTitle">—</span>
          <span class="stepper"><button class="iconbtn" id="calPrev" type="button" aria-label="이전 달" style="width:24px;height:24px"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3 5 8l5 5"/></svg></button><button class="iconbtn" id="calNext" type="button" aria-label="다음 달" style="width:24px;height:24px"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 3 5 5-5 5"/></svg></button></span>
        </h5>
        <div class="cal-grid" id="cal"></div>
      </div>
      <div class="panel" id="trendPanel">
        <h5>일별 이슈 수 <span class="mono" style="font-weight:400" id="trendNote"></span></h5>
        <svg class="spark" id="spark" viewBox="0 0 268 64" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
      <div class="panel">
        <h5>많이 나온 키워드</h5>
        <ul class="rank" id="kw"></ul>
      </div>
      <div class="panel">
        <h5>자주 언급된 기업·기관</h5>
        <ul class="rank" id="cos"></ul>
      </div>
      <p class="foot" id="foot"></p>
    </aside>
  </div>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = {
    get(k, d){ try { const v = localStorage.getItem('hrr.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v){ try { localStorage.setItem('hrr.' + k, JSON.stringify(v)); } catch {} }
  };
  const CAT_COLOR = { market:'--c-market', trend:'--c-trend', labor:'--c-labor', ecom:'--c-ecom', brand:'--c-brand' };
  const catColor = id => `var(${CAT_COLOR[id] || '--muted'})`;
  const DOW = ['일','월','화','수','목','금','토'];
  const d2s = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const s2d = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const fmt = s => { const d = s2d(s); return `${d.getMonth()+1}.${d.getDate()} (${DOW[d.getDay()]})`; };

  let META = {}, REPORTS = [], byDate = new Map(), dates = [];
  const st = {
    view: store.get('view', 'day'), anchor: null, cat: 'all',
    teams: store.get('teams', []), high: false, own: false, q: '', calMonth: null
  };

  function rangeFor(view, anchor){
    const a = s2d(anchor);
    if (view === 'day') return [anchor, anchor];
    if (view === 'week'){
      const mon = new Date(a); mon.setDate(a.getDate() - ((a.getDay() + 6) % 7));
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      return [d2s(mon), d2s(sun)];
    }
    return [d2s(new Date(a.getFullYear(), a.getMonth(), 1)), d2s(new Date(a.getFullYear(), a.getMonth()+1, 0))];
  }
  const inRange = ([s, e]) => dates.filter(d => d >= s && d <= e);

  function periodReports(){ return inRange(rangeFor(st.view, st.anchor)).map(d => byDate.get(d)); }

  function allItems(reps){
    const out = [];
    reps.forEach(r => (r.items || []).forEach(it => out.push({ ...it, _day: r.date })));
    return out;
  }
  // AI가 팀을 못 붙인 카드는 카테고리 기본 팀으로 봐요
  function teamsOf(it){
    if ((it.teams || []).length) return it.teams;
    return (META.categories.find(c => c.id === it.cat) || {}).teams || [];
  }
  function filtered(items){
    const q = st.q.trim().toLowerCase();
    return items.filter(it =>
      (st.cat === 'all' || it.cat === st.cat) &&
      (!st.teams.length || teamsOf(it).some(t => st.teams.includes(t))) &&
      (!st.high || it.importance === 'high') &&
      (!st.own || it.our_group) &&
      (!q || [it.title, it.company, it.body, (it.tags||[]).join(' '), it.insight].join(' ').toLowerCase().includes(q))
    );
  }

  function renderHeader(){
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === st.view)));
    const [s, e] = rangeFor(st.view, st.anchor);
    const a = s2d(st.anchor);
    $('#rangeLabel').textContent = st.view === 'day' ? fmt(st.anchor)
      : st.view === 'week' ? `${fmt(s)} ~ ${fmt(e)}` : `${a.getFullYear()}년 ${a.getMonth()+1}월`;
    const idx = dates.indexOf(st.anchor);
    const oldest = dates[dates.length-1], newest = dates[0];
    $('#prev').disabled = st.view === 'day' ? idx >= dates.length - 1 : s <= oldest;
    $('#next').disabled = st.view === 'day' ? idx <= 0 : e >= newest;
  }

  function renderBrief(reps, items){
    const high = items.filter(i => i.importance === 'high');
    // 왼쪽 패널: 꼭 볼 이슈 목록 (제목 → 원문 기사 링크)
    const label = st.view === 'day' ? (st.anchor === dates[0] ? '오늘' : '그날') : st.view === 'week' ? '이번 주' : '이번 달';
    $('#leadEyebrow').textContent = `${label}의 꼭 볼 이슈`;
    const r0 = reps[0];
    $('#leadDate').textContent = st.view === 'day'
      ? (r0 ? `${r0.date}${r0.window_days > 1 ? ` · 최근 ${r0.window_days}일 기사` : ''}` : '')
      : `${reps.length}일치 브리핑`;
    const seenT = new Set(), list = [];
    [...high].sort((a, b) => (b._day || '').localeCompare(a._day || '') || (b.sources?.length||0) - (a.sources?.length||0))
      .forEach(i => { const k = i.title; if (!seenT.has(k)){ seenT.add(k); list.push(i); } });
    const MAX = st.view === 'day' ? 8 : 6, shown = list.slice(0, MAX);
    $('#headline').hidden = !!list.length;
    $('#headline').textContent = reps.length ? `${label}은 꼭 볼 이슈가 없어요` : '이 기간에는 브리핑이 없어요';
    $('#points').innerHTML = shown.map((it, n) => {
      const src = (it.sources || []).find(x => x.url && !x.url.startsWith('#'));
      const cat = META.categories.find(c => c.id === it.cat);
      const title = src
        ? `<a class="pt-title" href="${esc(src.url)}" target="_blank" rel="noopener">${esc(it.title)}<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h7v7M13 3 4 12"/></svg></a>`
        : `<span class="pt-title">${esc(it.title)}</span>`;
      return `<li><span class="pt-n">${String(n+1).padStart(2,'0')}</span><div>${title}
        <div class="pt-meta"><i class="dot" style="background:${catColor(it.cat)}"></i>${[cat?.name, it.company, src?.name, st.view !== 'day' ? fmt(it._day) : ''].filter(Boolean).map(esc).join(' · ')}</div></div></li>`;
    }).join('') + (list.length > MAX ? `<li class="pt-more"><span></span><button type="button" id="moreHigh">외 ${list.length - MAX}건 더 보기 →</button></li>` : '');
    const mh = $('#moreHigh'); if (mh) mh.addEventListener('click', () => $('#heroHigh').click());
    $('#kCards').textContent = items.length;
    $('#kHigh').textContent = high.length;
    const hero = $('#heroHigh');
    hero.classList.toggle('zero', !high.length);
    $('#heroHint').textContent = !high.length ? '오늘은 없어요' : st.high ? '전체 보기 →' : '꼭 볼 이슈만 보기 →';
    $('#kArticles').textContent = reps.reduce((s, r) => s + (r.article_count || 0), 0).toLocaleString('ko-KR');

    const cnt = {}; items.forEach(i => cnt[i.cat] = (cnt[i.cat]||0) + 1);
    const total = items.length || 1;
    $('#distBar').innerHTML = META.categories.filter(c => cnt[c.id])
      .map(c => `<i style="width:${cnt[c.id]/total*100}%;background:${catColor(c.id)}" title="${esc(c.name)} ${cnt[c.id]}"></i>`).join('');
    $('#legend').innerHTML = META.categories.map(c =>
      `<span><i class="dot" style="background:${catColor(c.id)}"></i>${esc(c.name)} <b class="mono" style="font-weight:500">${cnt[c.id]||0}</b></span>`).join('');
  }

  function renderTabs(items){
    const save = st.cat; st.cat = 'all';
    const pool = filtered(items); st.cat = save;
    const cnt = {}; pool.forEach(i => cnt[i.cat] = (cnt[i.cat]||0) + 1);
    const tabs = [{ id:'all', name:'전체', n: pool.length }, ...META.categories.map(c => ({ id:c.id, name:c.name, desc:c.desc, n: cnt[c.id]||0 }))];
    $('#tabs').innerHTML = tabs.map(t =>
      `<button class="tab" role="tab" type="button" data-cat="${t.id}" aria-selected="${st.cat === t.id}" title="${esc(t.desc||'')}">
        ${t.id !== 'all' ? `<i class="dot" style="background:${catColor(t.id)}"></i>` : ''}${esc(t.name)}<span class="n">${t.n}</span></button>`).join('');
  }

  function renderTeams(){
    $('#teamChips').innerHTML = (META.teams || []).map(t =>
      `<button class="chip" type="button" data-team="${esc(t)}" aria-pressed="${st.teams.includes(t)}">${esc(t)}</button>`).join('');
  }

  function card(it){
    const cat = META.categories.find(c => c.id === it.cat);
    const srcs = (it.sources || []).map(s => {
      const real = s.url && !s.url.startsWith('#');
      return `<li>${real ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">` : '<a>'}<span class="sn">${esc(s.name || '출처')}</span><span class="st">${esc(s.title || '')}</span></a></li>`;
    }).join('');
    return `<details class="card${it.importance === 'high' ? ' is-high' : ''}">
      <summary>
        <div class="meta">
          <span class="cat" style="color:${catColor(it.cat)}"><i class="dot" style="background:${catColor(it.cat)}"></i>${esc(cat?.name || it.cat)}</span>
          ${it.importance === 'high' ? '<span class="pill high">꼭 볼 이슈</span>' : it.importance === 'mid' ? '<span class="pill mid">챙겨볼 이슈</span>' : ''}
          ${it.our_group ? '<span class="pill own">우리 그룹</span>' : ''}
          <span class="co">${esc(it.company)}</span>
          <span class="dt">${esc(it.date || it._day)}</span>
        </div>
        <h3>${esc(it.title)}</h3>
        <p class="body">${esc(it.body)}</p>
        <span class="more"><span class="t1">시사점 · 해볼 일 · 출처 ${(it.sources||[]).length}건</span><span class="t2">접기</span>
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 6 5 5 5-5"/></svg></span>
      </summary>
      <div class="detail">
        ${it.insight || it.action ? `<div class="two">
          ${it.insight ? `<div class="box"><h4>HR 시사점</h4><p>${esc(it.insight)}</p></div>` : ''}
          ${it.action ? `<div class="box"><h4>해볼 일</h4><p>${esc(it.action)}</p></div>` : ''}
        </div>` : ''}
        ${teamsOf(it).length || (it.tags||[]).length ? `<div class="who">
          ${teamsOf(it).length ? '<span>누가 보면 좋을까</span>' + teamsOf(it).map(t => `<span class="team">${esc(t)}</span>`).join('') : ''}
          ${(it.tags||[]).map(t => `<span class="tag">#${esc(t)}</span>`).join('')}
        </div>` : ''}
        <ul class="srcs">${srcs}</ul>
      </div>
    </details>`;
  }

  function renderList(items){
    const list = filtered(items);
    if (!list.length){
      $('#list').innerHTML = `<div class="empty">조건에 맞는 이슈가 없어요. 필터를 줄이거나 다른 기간을 골라 보세요.</div>`;
      return;
    }
    if (st.view === 'day'){ $('#list').innerHTML = list.map(card).join(''); return; }
    const groups = new Map();
    list.forEach(i => { if (!groups.has(i._day)) groups.set(i._day, []); groups.get(i._day).push(i); });
    $('#list').innerHTML = [...groups].map(([d, arr]) => `<div class="day-h">${fmt(d)} <span class="mono" style="font-weight:400">${arr.length}건</span></div>` + arr.map(card).join('')).join('');
  }

  function renderRail(items){
    // calendar
    const cm = st.calMonth; const first = new Date(cm.y, cm.m, 1);
    $('#calTitle').textContent = `${cm.y}년 ${cm.m+1}월`;
    const [rs, re] = rangeFor(st.view, st.anchor);
    let h = DOW.map(d => `<span class="dw">${d}</span>`).join('');
    for (let i = 0; i < first.getDay(); i++) h += '<span></span>';
    const last = new Date(cm.y, cm.m+1, 0).getDate();
    for (let d = 1; d <= last; d++){
      const ds = d2s(new Date(cm.y, cm.m, d)); const r = byDate.get(ds);
      const hot = r && (r.items||[]).some(i => i.importance === 'high');
      const cls = [r ? 'has' : '', hot ? 'hot' : '', ds === st.anchor && st.view === 'day' ? 'sel' : '', st.view !== 'day' && ds >= rs && ds <= re ? 'inr' : ''].join(' ');
      h += `<button type="button" class="${cls}" ${r ? `data-date="${ds}"` : 'tabindex="-1" aria-disabled="true"'} aria-label="${ds}">${d}</button>`;
    }
    $('#cal').innerHTML = h;
    const minD = dates[dates.length-1], maxD = dates[0];
    $('#calPrev').disabled = d2s(first) <= minD;
    $('#calNext').disabled = d2s(new Date(cm.y, cm.m+1, 0)) >= maxD;

    // trend (last 30 report days ending at range end)
    const endIdx = dates.findIndex(d => d <= re);
    const win = dates.slice(Math.max(endIdx,0), Math.max(endIdx,0) + 20).reverse();
    const vals = win.map(d => (byDate.get(d).items || []).length);
    const hi = win.map(d => (byDate.get(d).items || []).filter(i => i.importance === 'high').length);
    const W = 268, H = 64, max = Math.max(...vals, 1), bw = W / Math.max(win.length, 1);
    let svg = '';
    [0.5, 1].forEach(f => svg += `<line x1="0" x2="${W}" y1="${H - (H-6)*f}" y2="${H - (H-6)*f}" stroke="var(--line)" stroke-width="1"/>`);
    win.forEach((d, i) => {
      const x = i*bw + bw*0.18, w = bw*0.64, v = vals[i]*(H-6)/max, hv = hi[i]*(H-6)/max;
      const sel = d >= rs && d <= re;
      svg += `<rect x="${x}" y="${H-v}" width="${w}" height="${v}" rx="1.5" fill="${sel ? 'var(--accent)' : 'var(--line2)'}"><title>${d} · ${vals[i]}건 (꼭 볼 ${hi[i]})</title></rect>`;
      if (hv) svg += `<rect x="${x}" y="${H-hv}" width="${w}" height="${hv}" rx="1.5" fill="var(--high)" opacity=".85"/>`;
    });
    $('#spark').innerHTML = svg;
    $('#trendNote').textContent = `최근 ${win.length}일 · 최대 ${max}`;

    // keywords & companies (current filters except search)
    const pool = items;
    const rank = (arr, el) => {
      const m = {}; arr.forEach(x => { if (x) m[x] = (m[x]||0) + 1; });
      const top = Object.entries(m).sort((a,b) => b[1]-a[1]).slice(0, 8); const mx = top[0]?.[1] || 1;
      $(el).innerHTML = top.length ? top.map(([k, n]) => `<li><button type="button" data-q="${esc(k)}">${esc(k)}</button><span class="bar"><i style="width:${Math.max(6, n/mx*60)}px"></i>${n}</span></li>`).join('')
        : '<li style="color:var(--sub)">아직 없어요</li>';
    };
    rank(pool.flatMap(i => i.tags || []), '#kw');
    rank(pool.map(i => i.company).filter(c => c && c !== '업계 전반'), '#cos');

    const up = META.updated ? META.updated.replace('T', ' ') : '';
    $('#foot').innerHTML = `마지막 수집 ${esc(up)}<br>Google 뉴스에서 모은 기사를 AI가 분류·요약했어요. 중요한 결정 전에는 출처 기사를 꼭 확인해 주세요.`;
  }

  function render(){
    const reps = periodReports();
    const items = allItems(reps);
    renderHeader(); renderBrief(reps, items); renderTabs(items); renderTeams(); renderList(items); renderRail(items);
    $('#onlyHigh').setAttribute('aria-pressed', st.high);
    $('#heroHigh').setAttribute('aria-pressed', st.high);
    $('#onlyOwn').setAttribute('aria-pressed', st.own);
    $('#resetFilters').hidden = !(st.teams.length || st.high || st.own || st.q || st.cat !== 'all');
  }

  function setAnchor(d){
    st.anchor = d; const a = s2d(d); st.calMonth = { y: a.getFullYear(), m: a.getMonth() };
  }
  function step(dir){
    if (st.view === 'day'){
      const i = dates.indexOf(st.anchor) - dir; if (dates[i]) setAnchor(dates[i]);
    } else {
      const [s, e] = rangeFor(st.view, st.anchor);
      const cand = dir > 0 ? dates.filter(d => d > e).pop() : dates.find(d => d < s);
      if (cand) setAnchor(cand);
    }
    render();
  }

  // events
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { st.view = b.dataset.view; store.set('view', st.view); render(); }));
  $('#prev').addEventListener('click', () => step(-1));
  $('#next').addEventListener('click', () => step(1));
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b){ st.cat = b.dataset.cat; render(); } });
  $('#teamChips').addEventListener('click', e => {
    const b = e.target.closest('[data-team]'); if (!b) return;
    const t = b.dataset.team; st.teams = st.teams.includes(t) ? st.teams.filter(x => x !== t) : [...st.teams, t];
    store.set('teams', st.teams); render();
  });
  $('#heroHigh').addEventListener('click', e => {
    if (e.currentTarget.classList.contains('zero')) return;
    st.high = !st.high; render();
    if (st.high) document.querySelector('.grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('#resetFilters').addEventListener('click', () => {
    st.teams = []; st.high = false; st.own = false; st.q = ''; st.cat = 'all';
    $('#q').value = ''; store.set('teams', []); render();
  });
  $('#onlyHigh').addEventListener('click', e => { st.high = !st.high; e.currentTarget.setAttribute('aria-pressed', st.high); render(); });
  $('#onlyOwn').addEventListener('click', e => { st.own = !st.own; e.currentTarget.setAttribute('aria-pressed', st.own); render(); });
  let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { st.q = e.target.value; render(); }, 150); });
  document.querySelector('.rail').addEventListener('click', e => {
    const d = e.target.closest('[data-date]'); if (d){ setAnchor(d.dataset.date); if (st.view !== 'day'){ st.view = 'day'; store.set('view','day'); } render(); return; }
    const k = e.target.closest('[data-q]'); if (k){ st.q = k.dataset.q; $('#q').value = st.q; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });
  $('#calPrev').addEventListener('click', () => { const c = st.calMonth; st.calMonth = c.m ? { y:c.y, m:c.m-1 } : { y:c.y-1, m:11 }; renderRail(allItems(periodReports())); });
  $('#calNext').addEventListener('click', () => { const c = st.calMonth; st.calMonth = c.m < 11 ? { y:c.y, m:c.m+1 } : { y:c.y+1, m:0 }; renderRail(allItems(periodReports())); });
  $('#csv').addEventListener('click', () => {
    const rows = filtered(allItems(periodReports()));
    const names = Object.fromEntries(META.categories.map(c => [c.id, c.name]));
    const head = ['날짜','분류','중요도','기업','제목','요약','HR 시사점','해볼 일','관련 팀','키워드','출처','링크'];
    const imp = { high:'꼭 볼 이슈', mid:'챙겨볼 이슈', low:'참고' };
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const csv = [head, ...rows.map(i => [i.date || i._day, names[i.cat] || i.cat, imp[i.importance] || '', i.company, i.title, i.body, i.insight, i.action,
      teamsOf(i).join(', '), (i.tags||[]).join(', '), (i.sources||[]).map(s => s.name).join(', '), i.sources?.[0]?.url || ''])]
      .map(r => r.map(q).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `hr-radar_${$('#rangeLabel').textContent.replace(/[^\d.~]/g, '')}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  });

  fetch('data.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
    META = data.meta || {}; META.categories = META.categories || [];
    REPORTS = (data.reports || []).slice().sort((a, b) => b.date.localeCompare(a.date));
    // 합쳐진 카테고리: 예전 '채용 브랜딩' 카드는 '채용 시장·브랜딩' 탭으로
    const ALIAS = { brand: 'market' }, known = new Set(META.categories.map(c => c.id));
    REPORTS.forEach(r => (r.items || []).forEach(i => { if (!known.has(i.cat) && ALIAS[i.cat]) i.cat = ALIAS[i.cat]; }));
    REPORTS.forEach(r => byDate.set(r.date, r)); dates = REPORTS.map(r => r.date);
    if (META.site_title){ $('#siteTitle').textContent = META.site_title; document.title = META.site_title; }
    if (META.site_subtitle) $('#siteSub').textContent = META.site_subtitle;
    $('#sampleNote').hidden = !REPORTS.some(r => r.sample);
    if (!dates.length){ $('#headline').textContent = '아직 수집된 브리핑이 없어요'; $('#list').innerHTML = '<div class="empty">첫 자동 수집이 끝나면 여기에 이슈가 채워져요.</div>'; return; }
    setAnchor(dates[0]);
    render();
  }).catch(err => {
    $('#headline').textContent = '데이터를 불러오지 못했어요';
    $('#list').innerHTML = `<div class="empty">data.json을 읽지 못했어요 (${esc(err.message)}). 사이트 주소로 접속했는지, web 폴더에 data.json이 있는지 확인해 주세요.</div>`;
  });
})();
</script>
</body>
</html>
