name: HR 레이더 데일리 수집

on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 밀리거나 빠지는 날이 있어서 여러 번 걸어 둬요.
    # 오늘 수집이 이미 끝났으면 뒤의 예약은 바로 건너뛰어요.
    - cron: '7 22 * * *'      # 07:07 KST
    - cron: '10 23 * * *'     # 08:10 KST
    - cron: '47 23 * * *'     # 08:47 KST
    - cron: '17 1 * * *'      # 10:17 KST
    - cron: '17 3 * * *'      # 12:17 KST
    - cron: '17 6 * * *'      # 15:17 KST
  workflow_dispatch:           # Actions 탭에서 'Run workflow'로 바로 실행
    inputs:
      weekly:
        description: '지난주 채용 위클리 카드뉴스도 지금 만들기 (평소엔 월요일 아침 자동)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['web/**']          # 화면 파일을 고치면 사이트만 다시 배포

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hr-radar
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.c.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        name: 오늘 수집이 끝났는지 확인
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          if grep -q "\"date\": *\"$today\"" web/data.json && grep -q "\"date\": *\"$today\"" web/jobs.json; then
            echo "오늘($today) 수집은 이미 끝났어요"; echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests --quiet
      - name: 뉴스 수집 · AI 분석
        env:
          TZ: Asia/Seoul
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:     ${{ vars.GEMINI_MODEL }}
          MS_TENANT_ID:     ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:     ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ALERT_EMAIL_TO:   ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: python run_report.py
      - name: 빅테크 직무 추이 (채용 공고 수집)
        continue-on-error: true
        env:
          TZ: Asia/Seoul
        run: python run_jobs.py
      - name: 데일리 채용 추이 수집
        continue-on-error: true    # 실패해도 HR 뉴스 저장은 계속해요
        env:
          TZ: Asia/Seoul
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:     ${{ vars.GEMINI_MODEL }}
          MS_TENANT_ID:     ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:     ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ALERT_EMAIL_TO:   ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: python run_trends.py
      - name: 채용 위클리 카드뉴스 (월요일, 지난주 월~일)
        continue-on-error: true
        env:
          TZ: Asia/Seoul
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:     ${{ vars.GEMINI_MODEL }}
          MS_TENANT_ID:     ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:     ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ALERT_EMAIL_TO:   ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ] || [ "${{ inputs.weekly }}" = "true" ]; then
            python run_weekly.py
          else
            echo "월요일이 아니라 카드뉴스는 건너뛰어요"
          fi
      - name: 결과 저장
        run: |
          git config user.name  "HR Radar Bot"
          git config user.email "hr-radar-bot@users.noreply.github.com"
          git add web/data.json web/trends.json web/weekly.json web/jobs.json reports/
          git diff --cached --quiet || git commit -m "📡 HR 레이더 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase --quiet && git push

  deploy:
    needs: collect
    if: always() && (needs.collect.result == 'success' || (needs.collect.result == 'skipped' && github.event_name == 'push'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: pages
        uses: actions/deploy-pages@v4
